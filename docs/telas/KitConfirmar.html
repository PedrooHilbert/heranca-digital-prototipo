<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":820}}'>
class Component extends DCLogic {
  hdAcoes() {
    const A = [["a0", "Baixar o kit de novo (PDF)", "Kit baixado"]];
    const st = this.state || {};
    const o = {};
    A.forEach(([k, ini, dep]) => {
      const alterna = dep.startsWith('<->');
      const alt = alterna ? dep.slice(3) : dep;
      const on = !!st['hd_' + k];
      o[k] = on ? alt : ini;
      o[k + 'D'] = on ? '1' : '0';
      o[k + 'F'] = () => this.setState({ ['hd_' + k]: alterna ? !on : true });
    });
    return o;
  }
  renderVals() {
    const __hd = this.hdAcoes();
    return { hd: __hd };
  }
}
</script>
